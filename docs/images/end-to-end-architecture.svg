<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Resource Graph Crawler and Document Intelligence Architecture</title>
  <desc id="description">Two independent workflows share one FastAPI application: an authenticated bounded crawler and an asynchronous document OCR, entity evidence, persistence, and search pipeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#44605a"/></marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bdd6cd"/></marker>
    <style>
      .bg{fill:#f2f5f0}.ink{fill:#182b28}.muted{fill:#58706a}.h1{font:700 38px 'Segoe UI',sans-serif}.sub{font:16px 'Segoe UI',sans-serif}.section{font:700 20px 'Segoe UI',sans-serif;letter-spacing:1px}.title{font:700 17px 'Segoe UI',sans-serif}.body{font:14px 'Segoe UI',sans-serif}.small{font:12px 'Segoe UI',sans-serif}.node{stroke-width:2}.line{fill:none;stroke:#44605a;stroke-width:2.5;marker-end:url(#arrow)}.line-light{fill:none;stroke:#bdd6cd;stroke-width:2.5;marker-end:url(#arrow-light)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <rect x="0" y="0" width="1600" height="160" fill="#173f3b"/>
  <text x="72" y="72" class="h1" fill="#f4f5ed">One service. Two bounded workflows.</text>
  <text x="74" y="112" class="sub" fill="#d2e3d9">Crawler discovery stays separate from private, user-submitted document processing.</text>
  <rect x="1225" y="48" width="300" height="42" rx="21" fill="#2f655b"/>
  <text x="1375" y="75" text-anchor="middle" class="small" fill="#f4f5ed">LOCAL / DOCKER DOCUMENT WORKER</text>

  <rect x="55" y="190" width="1490" height="375" rx="16" fill="#e6eef7" stroke="#5b85b6" stroke-width="2"/>
  <text x="82" y="230" class="section" fill="#254f7a">01  RESOURCE-GRAPH CRAWLER</text>
  <text x="82" y="256" class="small muted">Authenticated BFS over discovered same-host web resources</text>

  <g>
    <rect class="node" x="82" y="292" width="215" height="82" rx="10" fill="#fff" stroke="#5b85b6"/>
    <text x="102" y="324" class="title ink">CLI / Tkinter</text><text x="102" y="350" class="body muted">main.py · gui.py</text>
    <rect class="node" x="82" y="410" width="215" height="82" rx="10" fill="#fff" stroke="#5b85b6"/>
    <text x="102" y="442" class="title ink">Crawler API</text><text x="102" y="468" class="body muted">POST /api/v1/crawl</text>

    <rect class="node" x="365" y="340" width="250" height="100" rx="12" fill="#d9e9f5" stroke="#4683a4"/>
    <text x="490" y="379" text-anchor="middle" class="title ink">Crawler engine</text><text x="490" y="405" text-anchor="middle" class="body muted">bounded BFS · worker pool</text>

    <rect class="node" x="695" y="292" width="230" height="82" rx="10" fill="#fff" stroke="#4683a4"/>
    <text x="810" y="324" text-anchor="middle" class="title ink">Authenticated fetch</text><text x="810" y="350" text-anchor="middle" class="body muted">scope · redirects · retries</text>
    <rect class="node" x="695" y="410" width="230" height="82" rx="10" fill="#fff" stroke="#4683a4"/>
    <text x="810" y="442" text-anchor="middle" class="title ink">Discovery + extraction</text><text x="810" y="468" text-anchor="middle" class="body muted">HTML · JS · CSS · bytes · OCR</text>

    <rect class="node" x="1010" y="340" width="230" height="100" rx="12" fill="#ffe4df" stroke="#cf624d"/>
    <text x="1125" y="379" text-anchor="middle" class="title ink">Allowed target host</text><text x="1125" y="405" text-anchor="middle" class="body muted">same-host boundary</text>

    <rect class="node" x="1320" y="340" width="190" height="100" rx="12" fill="#ffedc7" stroke="#cb9332"/>
    <text x="1415" y="379" text-anchor="middle" class="title ink">Frontier + results</text><text x="1415" y="405" text-anchor="middle" class="body muted">visited · completeness</text>

    <path class="line" d="M297 333H330V366H365"/><path class="line" d="M297 451H330V410H365"/>
    <path class="line" d="M615 366H655V333H695"/><path class="line" d="M615 414H655V451H695"/>
    <path class="line" d="M925 333H1010"/><path class="line" d="M1010 423H965V451H925"/>
    <path class="line" d="M925 451H1320"/><path class="line" d="M1320 390H1275V292H490V340"/>
  </g>

  <rect x="55" y="590" width="1490" height="455" rx="16" fill="#e8f0e8" stroke="#558b70" stroke-width="2"/>
  <text x="82" y="632" class="section" fill="#275e46">02  ASYNCHRONOUS DOCUMENT INTELLIGENCE</text>
  <text x="82" y="658" class="small muted">Private uploads only · persist first · process outside the HTTP request · evidence follows every extracted entity</text>

  <g>
    <rect class="node" x="82" y="705" width="205" height="100" rx="11" fill="#fff" stroke="#558b70"/>
    <text x="184" y="744" text-anchor="middle" class="title ink">Browser workbench</text><text x="184" y="772" text-anchor="middle" class="body muted">upload · poll · inspect</text>

    <rect class="node" x="345" y="705" width="205" height="100" rx="11" fill="#d9ebe0" stroke="#558b70"/>
    <text x="448" y="744" text-anchor="middle" class="title ink">Validate + persist</text><text x="448" y="772" text-anchor="middle" class="body muted">signature · limits · source</text>

    <rect class="node" x="610" y="705" width="205" height="100" rx="11" fill="#ffedc7" stroke="#cb9332"/>
    <text x="712" y="744" text-anchor="middle" class="title ink">SQLite job</text><text x="712" y="772" text-anchor="middle" class="body muted">QUEUED → PROCESSING</text>

    <rect class="node" x="875" y="705" width="205" height="100" rx="11" fill="#d9e9f5" stroke="#4683a4"/>
    <text x="977" y="744" text-anchor="middle" class="title ink">CV preprocessing</text><text x="977" y="772" text-anchor="middle" class="body muted">resize · denoise · deskew</text>

    <rect class="node" x="1140" y="705" width="205" height="100" rx="11" fill="#efe4f3" stroke="#8b6798"/>
    <text x="1242" y="744" text-anchor="middle" class="title ink">OCR + entities</text><text x="1242" y="772" text-anchor="middle" class="body muted">blocks · boxes · evidence</text>

    <rect class="node" x="1380" y="705" width="130" height="100" rx="11" fill="#fff" stroke="#558b70"/>
    <text x="1445" y="744" text-anchor="middle" class="title ink">Search</text><text x="1445" y="772" text-anchor="middle" class="body muted">SQLite FTS5</text>

    <path class="line" d="M287 755H345"/><path class="line" d="M550 755H610"/>
    <path class="line" d="M815 755H875"/><path class="line" d="M1080 755H1140"/>
    <path class="line" d="M1345 755H1380"/>

    <rect class="node" x="345" y="875" width="320" height="95" rx="11" fill="#fff" stroke="#558b70"/>
    <text x="505" y="912" text-anchor="middle" class="title ink">Original upload</text><text x="505" y="940" text-anchor="middle" class="body muted">atomic file write · never modified</text>
    <rect class="node" x="760" y="875" width="430" height="95" rx="11" fill="#fff" stroke="#558b70"/>
    <text x="975" y="912" text-anchor="middle" class="title ink">Durable results + recovery</text><text x="975" y="940" text-anchor="middle" class="body muted">pages · entities · errors · restart requeue · bounded retries</text>
    <path class="line" d="M448 805V850L505 875"/><path class="line" d="M712 805V850L505 875"/>
    <path class="line" d="M1242 805V850L1190 875"/><path class="line" d="M975 875V850L977 805"/>
    <path class="line" d="M1190 922H1268V830H1242"/>

    <rect x="82" y="990" width="1428" height="34" rx="7" fill="#173f3b"/>
    <text x="796" y="1013" text-anchor="middle" class="small" fill="#f4f5ed">Shared FastAPI shell · bearer-key protected · document APIs run locally / Docker, not serverless</text>
  </g>
</svg>
services:
  crawler:
    build: .
    image: resource-graph-crawler:1.1.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RGC_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
